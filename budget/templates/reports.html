{% extends "base.html" %}
{% load static %}
{% block content %}
  <div class="reports flex h-screen">
    <div class="report-graph w-3/4 border-r -mt-4">
      <canvas class="spending-chart mt-8" data-chart-labels="{{ chart_labels }}" data-chart-data="{{ chart_data }}" data-chart-percentages="{{ chart_percentages }}" data-total-spending="{{ total_spending }}"></canvas>
      <canvas class="cash-flow-chart mt-8" data-cashflow="{{ cashflow_data }}"></canvas>
    </div>
    <div class="spendings_legend w-1/4">
      <div class="total_spending text-center border-b py-2">
        <h1>Total Spending</h1>
        <span class="font-bold text-xl">{{ spending_data.total_spending }}€</span>
      </div>
      <div class="average_spending text-center border-b py-2">
        <h1>Average Spending</h1>
        <span class="font-bold text-xl">{{ spending_data.average_spending }}€</span>
      </div>
      <div class="spending_per_category_container p-2">
        <div class="header flex justify-between">
          <h1 class="font-bold">Categories</h1>
          <h1 class="font-bold">Spending</h1>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{% static "budget/js/chart.js" %}"></script>
  <script src="{% static "budget/js/cash-flow.js" %}"></script>
{% endblock %}
